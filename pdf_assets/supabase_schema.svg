<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="auto">
  <defs>
    <filter id="schemaShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .tbl-card { fill: #1e1e24; stroke: #33333d; stroke-width: 1.5; rx: 8px; filter: url(#schemaShadow); }
    .tbl-header { fill: #282830; rx: 8px; }
    .tbl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .col-name { font-family: 'Consolas', 'Menlo', 'Monaco', monospace; font-size: 11px; fill: #e0e0e0; }
    .col-type { font-family: 'Consolas', 'Menlo', 'Monaco', monospace; font-size: 10px; fill: #8b949e; text-anchor: end; }
    .pk-badge { fill: #e3b341; }
    .fk-badge { fill: #58a6ff; }
    .rel-line { stroke: #673ab7; stroke-width: 2; fill: none; }
  </style>

  <!-- Background grid dots -->
  <rect width="850" height="360" fill="#131316" rx="10"/>

  <!-- TABLE: students -->
  <g transform="translate(30, 25)">
    <rect width="210" height="115" class="tbl-card"/>
    <path d="M 0 8 Q 0 0 8 0 L 202 0 Q 210 0 210 8 L 210 30 L 0 30 Z" class="tbl-header"/>
    <text x="14" y="20" class="tbl-title">📁 students</text>
    <circle cx="16" cy="48" r="3" class="pk-badge"/>
    <text x="26" y="52" class="col-name" font-weight="bold">register_no (PK)</text><text x="198" y="52" class="col-type">varchar</text>
    <circle cx="16" cy="72" r="2.5" fill="#8b949e"/>
    <text x="26" y="76" class="col-name">name</text><text x="198" y="76" class="col-type">varchar</text>
    <circle cx="16" cy="96" r="2.5" fill="#8b949e"/>
    <text x="26" y="100" class="col-name">email</text><text x="198" y="100" class="col-type">varchar</text>
  </g>

  <!-- TABLE: attempts -->
  <g transform="translate(290, 25)">
    <rect width="230" height="135" class="tbl-card"/>
    <path d="M 0 8 Q 0 0 8 0 L 222 0 Q 230 0 230 8 L 230 30 L 0 30 Z" class="tbl-header"/>
    <text x="14" y="20" class="tbl-title">⏱️ attempts (Timer)</text>
    <circle cx="16" cy="48" r="3" class="pk-badge"/>
    <text x="26" y="52" class="col-name" font-weight="bold">id (PK)</text><text x="218" y="52" class="col-type">int4</text>
    <circle cx="16" cy="72" r="2.5" fill="#8b949e"/>
    <text x="26" y="76" class="col-name">email</text><text x="218" y="76" class="col-type">varchar</text>
    <circle cx="16" cy="96" r="2.5" fill="#8b949e"/>
    <text x="26" y="100" class="col-name">started_ms</text><text x="218" y="100" class="col-type">int8</text>
    <circle cx="16" cy="120" r="2.5" fill="#8b949e"/>
    <text x="26" y="124" class="col-name">status</text><text x="218" y="124" class="col-type">varchar</text>
  </g>

  <!-- TABLE: settings -->
  <g transform="translate(570, 25)">
    <rect width="240" height="95" class="tbl-card"/>
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 30 L 0 30 Z" class="tbl-header"/>
    <text x="14" y="20" class="tbl-title">⚙️ settings</text>
    <circle cx="16" cy="48" r="3" class="pk-badge"/>
    <text x="26" y="52" class="col-name" font-weight="bold">key (PK)</text><text x="228" y="52" class="col-type">varchar</text>
    <circle cx="16" cy="72" r="2.5" fill="#8b949e"/>
    <text x="26" y="76" class="col-name">value</text><text x="228" y="76" class="col-type">text</text>
  </g>

  <!-- TABLE: selections -->
  <g transform="translate(30, 160)">
    <rect width="250" height="180" class="tbl-card"/>
    <path d="M 0 8 Q 0 0 8 0 L 242 0 Q 250 0 250 8 L 250 30 L 0 30 Z" class="tbl-header" style="fill: #2d1e44;"/>
    <text x="14" y="20" class="tbl-title" style="fill: #d1b3ff;">🔒 selections (FCFS Log)</text>
    <circle cx="16" cy="48" r="3" class="pk-badge"/>
    <text x="26" y="52" class="col-name" font-weight="bold">seq_id (PK)</text><text x="238" y="52" class="col-type">int4</text>
    <circle cx="16" cy="70" r="2.5" fill="#8b949e"/>
    <text x="26" y="74" class="col-name">register_no</text><text x="238" y="74" class="col-type">varchar</text>
    <circle cx="16" cy="90" r="2.5" fill="#8b949e"/>
    <text x="26" y="94" class="col-name">student_name</text><text x="238" y="94" class="col-type">varchar</text>
    <circle cx="16" cy="110" r="3" class="fk-badge"/>
    <text x="26" y="114" class="col-name" font-weight="bold" style="fill: #58a6ff;">faculty_id (FK)</text><text x="238" y="114" class="col-type">int4</text>
    <circle cx="16" cy="130" r="2.5" fill="#8b949e"/>
    <text x="26" y="134" class="col-name">created_ms</text><text x="238" y="134" class="col-type">int8</text>
    <circle cx="16" cy="150" r="2.5" fill="#8b949e"/>
    <text x="26" y="154" class="col-name">synced</text><text x="238" y="154" class="col-type">int4</text>
  </g>

  <!-- TABLE: faculty -->
  <g transform="translate(540, 175)">
    <rect width="270" height="145" class="tbl-card"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 30 L 0 30 Z" class="tbl-header" style="fill: #1a3324;"/>
    <text x="14" y="20" class="tbl-title" style="fill: #7ee787;">👨‍🏫 faculty (Capacities)</text>
    <circle cx="16" cy="48" r="3" class="pk-badge"/>
    <text x="26" y="52" class="col-name" font-weight="bold">id (PK)</text><text x="258" y="52" class="col-type">int4</text>
    <circle cx="16" cy="72" r="2.5" fill="#8b949e"/>
    <text x="26" y="76" class="col-name">name</text><text x="258" y="76" class="col-type">varchar</text>
    <circle cx="16" cy="96" r="2.5" fill="#8b949e"/>
    <text x="26" y="100" class="col-name">capacity</text><text x="258" y="100" class="col-type">int4</text>
    <circle cx="16" cy="120" r="2.5" fill="#8b949e"/>
    <text x="26" y="124" class="col-name">selected_count</text><text x="258" y="124" class="col-type">int4</text>
  </g>

  <!-- RELATIONSHIP LINE: selections.faculty_id -> faculty.id -->
  <path d="M 280 274 C 400 274, 420 223, 540 223" class="rel-line"/>
  <circle cx="280" cy="274" r="4" fill="#58a6ff"/>
  <circle cx="540" cy="223" r="4" fill="#673ab7"/>
  <text x="350" y="260" font-family="sans-serif" font-size="10" fill="#a78bfa" font-weight="bold">1 to Many FK</text>
</svg>
