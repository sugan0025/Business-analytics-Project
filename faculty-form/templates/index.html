<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <meta name="robots" content="noindex" />
  <link rel="dns-prefetch" href="https://accounts.google.com" />
  <link rel="preconnect" href="https://accounts.google.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v={{ v or '1' }}" />
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.onGsiLoaded && window.onGsiLoaded()"></script>
</head>
<body>

  <div id="timer" class="timer-pill hidden" aria-label="Time remaining"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6zm10 14.5V20H8v-3.5l4-4 4 4zm-4-5l-4-4V4h8v3.5l-4 4z"/></svg><span id="timerText">1:00</span></div>
  <main class="form-view" id="app">
    <div class="loading">Loading form…</div>
  </main>

  <div class="toast" id="toast" role="status">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    <span id="toastMsg"></span>
  </div>

  <script>
    window.APP = {{ cfg|tojson }};
    window.INITIAL_STATE = {{ (initial_state or {})|tojson }};
  </script>
  <script src="/form.js?v={{ v or '1' }}"></script>
</body>
</html>
