<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <meta name="robots" content="noindex" />
  <link rel="dns-prefetch" href="https://accounts.google.com" />
  <link rel="preconnect" href="https://accounts.google.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="timer" class="hidden" style="display:none;" aria-hidden="true"><span id="timerText"></span></div>
  <main class="form-view" id="app">
    <div class="loading">Loading form…</div>
  </main>

  <div class="toast" id="toast" role="status">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    <span id="toastMsg"></span>
  </div>

  <script>
    window.APP = {{ cfg|tojson }};
    window.INITIAL_STATE = {{ (initial_state or {})|tojson }};
  </script>
  <script src="/form.js"></script>
</body>
</html>
