<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="250" viewBox="0 0 1200 250" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3B82F6" fill-opacity="0.15" />
    </pattern>
    <filter id="glowBanner">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="250" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="250" fill="url(#dotGrid)" />

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="246" rx="15" fill="none" stroke="url(#accentLine)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Dynamic Glowing Swell Curves -->
  <path d="M 0 190 C 250 140, 500 230, 800 160 C 980 120, 1100 190, 1200 180 L 1200 250 L 0 250 Z" fill="#3B82F6" fill-opacity="0.08"/>
  <path d="M 0 205 C 300 160, 600 220, 900 175 C 1050 150, 1150 195, 1200 190" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" filter="url(#glowBanner)"/>
  <path d="M 0 225 C 200 180, 550 240, 850 195 C 1020 170, 1120 210, 1200 205" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- College Emblem Badge -->
  <g transform="translate(60, 50)">
    <rect width="68" height="68" rx="16" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="34" y="44" font-size="34" text-anchor="middle">⚡</text>
  </g>

  <!-- Title & Description -->
  <text x="150" y="82" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Faculty Guide Selection Platform <tspan fill="#38BDF8" font-size="22" font-weight="600">(II MBA)</tspan>
  </text>
  <text x="150" y="114" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
    High-Concurrency FCFS Seat Allocation • Google OAuth JWT • Live Google Sheets Sync • BIT Sathy
  </text>

  <!-- Feature Metric Badges -->
  <g transform="translate(150, 142)">
    <rect width="180" height="32" rx="16" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="1"/>
    <text x="90" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="middle">⚡ Sub-250ms Latency</text>
  </g>

  <g transform="translate(345, 142)">
    <rect width="190" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1"/>
    <text x="95" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">🔒 Zero Race Conditions</text>
  </g>

  <g transform="translate(550, 142)">
    <rect width="195" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1"/>
    <text x="97" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">📊 Google Sheets Sync v4</text>
  </g>

  <g transform="translate(760, 142)">
    <rect width="180" height="32" rx="16" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="middle">🎓 44 Students · 10 Faculty</text>
  </g>
</svg>
